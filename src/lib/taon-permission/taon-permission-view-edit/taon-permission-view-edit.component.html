<div class="taon-permission-view-edit">
  @if (editMode()) {
    <mat-form-field
      appearance="outline"
      subscriptSizing="dynamic"
      class="taon-permission-view-edit__field">
      <mat-label>{{ t.gettext('Description') }}</mat-label>

      <textarea
        matInput
        rows="4"
        [ngModel]="draftDescription()"
        (ngModelChange)="draftDescription.set($event)"
        [disabled]="saving()">
      </textarea>
    </mat-form-field>

    <div class="taon-permission-view-edit__actions">
      <button
        mat-flat-button
        color="primary"
        type="button"
        [disabled]="saving()"
        (click)="save()">
        <mat-icon> save </mat-icon>

        {{ t.gettext('Save') }}
      </button>

      <button
        mat-button
        type="button"
        [disabled]="saving()"
        (click)="cancel()">
        {{ t.gettext('Cancel') }}
      </button>
    </div>
  } @else {
    <div class="taon-permission-view-edit__description">
      {{ description() || t.gettext('No description') }}
    </div>

    <div class="taon-permission-view-edit__actions">
      <button
        mat-stroked-button
        type="button"
        (click)="edit()">
        <mat-icon> edit </mat-icon>

        {{ t.gettext('Edit') }}
      </button>
    </div>
  }
</div>
