<taon-datatable
  [entityCrudController]="crud"
  [columns]="columns"
  [allowedColumns]="['id', 'name', 'code']"
  searchMode="advanced"
  (addingItem)="add()"
  [expansionTemplate]="expansionTemplate">
</taon-datatable>

<ng-template
  #expansionTemplate
  let-permission>
  <taon-permission-details [permission]="permission"></taon-permission-details>
</ng-template>
