<div class="taon-role-chooser">
  <mat-form-field
    appearance="outline"
    subscriptSizing="dynamic"
    class="taon-role-chooser__field">
    <mat-label>{{ t.gettext('Role') }}</mat-label>

    <mat-select
      [(ngModel)]="selectedRoleId"
      [disabled]="loading() || saving()">
      @for (role of availableRoles; track role.id) {
        <mat-option [value]="role.id">
          {{ role.name }} ({{ role.code }})
        </mat-option>
      } @empty {
        <mat-option [disabled]="true">{{
          t.gettext('No roles available')
        }}</mat-option>
      }
    </mat-select>
  </mat-form-field>

  <button
    mat-flat-button
    color="primary"
    type="button"
    [disabled]="!selectedRoleId || saving()"
    (click)="assign()">
    <mat-icon> add </mat-icon>

    {{ t.gettext('Assign') }}
  </button>

  <button
    mat-button
    type="button"
    [disabled]="saving()"
    (click)="cancel()">
    {{ t.gettext('Cancel') }}
  </button>
</div>
