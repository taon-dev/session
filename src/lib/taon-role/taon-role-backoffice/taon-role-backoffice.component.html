<taon-datatable
  [entityCrudController]="crud"
  [columns]="columns"
  [allowedColumns]="['id', 'name', 'code']"
  searchMode="advanced"
  (addingItem)="add()"
  [expansionTemplate]="expansionTemplate">
</taon-datatable>
<ng-template #expansionTemplate let-role>
  <taon-role-details [role]="role"></taon-role-details>
</ng-template>
