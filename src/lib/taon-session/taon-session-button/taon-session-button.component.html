<div class="flex align-items-center gap-2">
  <ng-container
    *ngIf="
      (taonSessionStateService.isLoggedIn$ | async) === false;
      else loggedIn
    ">
    <button
      mat-button
      class="auth-button"
      (click)="open()">
      <mat-icon
        class="mobile-auth-icon"
        [class.mobile-auth-icon-none]="!showLabels()"
        >login</mat-icon
      >

      @if (showLabels()) {
        <span class="auth-button-text">
          {{ t.gettext('Login') }}
        </span>
      }
    </button>
  </ng-container>

  <ng-template #loggedIn>
    <button
      *ngIf="displayDashboardButton"
      mat-button
      color="primary"
      class="auth-btn"
      (click)="goDashboard()">
      <mat-icon
        class="mobile-auth-icon"
        [class.mobile-auth-icon-none]="!showLabels()"
        >dashboard</mat-icon
      >
      @if (showLabels()) {
        {{ t.gettext('Dashboard') }}
      }
    </button>

    <button
      mat-button
      class="auth-button ml-2"
      (click)="open(TaonSessionState.PROFILE_INFO)">
      <mat-icon
        class="mobile-auth-icon"
        [class.mobile-auth-icon-none]="!showLabels()"
        >account_circle</mat-icon
      >

      @if (showLabels()) {
        <span class="auth-button-text">
          {{
            t.gettext('Hello [[ userId ]]', {
              userId: username(),
            })
          }}
        </span>
      }
    </button>
  </ng-template>
</div>
